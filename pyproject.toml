[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectra"
version = "1.0.0"
description = "Weakly supervised learning of circulating rare cells from whole-slide liquid biopsy images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.7",
  "torch>=2.2",
  "pyyaml>=6",
  "matplotlib>=3.9",
  "pillow>=10",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.8",
  "h5py>=3.11",
  "umap-learn>=0.5.9",
  "leidenalg>=0.10",
  "igraph>=0.11",
]

[project.optional-dependencies]
imc = ["readimc>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]
